<script>
document.getElementById('year').textContent = new Date().getFullYear();

let routines = loadRoutines();
let logs = loadLogs();

function doneToday(routineId) {
  const t = todayStr();
  return logs.some((l) => l.routineId === routineId && l.date === t);
}

function toggle(routineId) {
  const t = todayStr();
  const idx = logs.findIndex((l) => l.routineId === routineId && l.date === t);
  if (idx >= 0) {
    logs.splice(idx, 1);
  } else {
    const r = routines.find((x) => x.id === routineId);
    logs.unshift({ id: uid(), routineId, title: r.title, cat: r.cat, date: t, createdAt: Date.now(), note: '' });
  }
  saveLogs(logs);
  render();
}

function render() {
  renderMural(logs);
  const grouped = CATS.map((c) => ({ cat: c, items: routines.filter((r) => r.cat === c.id) })).filter((g) => g.items.length);
  const listEl = document.getElementById('routine-list');

  if (routines.length === 0) {
    listEl.innerHTML = `<div class="empty">아직 루틴이 없어요.<br>'루틴' 탭에서 나만의 실행리스트를 만들어보세요.</div>`;
    return;
  }

  listEl.innerHTML = grouped.map((g) => `
    <div class="card">
      <div class="section-title"><span class="lv-dot" style="background:${g.cat.color}"></span>${g.cat.label}</div>
      ${g.items.map((r) => `
        <div class="routine">
          <button class="check ${doneToday(r.id) ? 'done' : ''}" data-toggle="${r.id}" aria-label="${escapeHtml(r.title)} 완료 체크">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="#1B1713" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="routine-body">
            <div class="routine-title ${doneToday(r.id) ? 'done' : ''}">${escapeHtml(r.title)}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');

  listEl.querySelectorAll('[data-toggle]').forEach((el) => {
    el.onclick = () => toggle(el.dataset.toggle);
  });
}

render();
</script>
