<main class="app">

<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

let routines = loadRoutines();
let logs = loadLogs();
const today = todayStr();
let editMode = false;

// ?date=YYYY-MM-DD 로 들어오면 그 날짜의 루틴을 보여줘요 (미래 날짜는 오늘로)
let date = new URLSearchParams(location.search).get('date');
if (!isValidDateStr(date) || date > today) date = today;

function setDate(next) {
  if (next > today) return;
  date = next;
  history.replaceState(null, '', location.pathname + (date === today ? '' : '?date=' + date));
  render();
}

function isDone(routineId) {
  return logs.some((l) => l.routineId === routineId && l.date === date);
}

function toggle(routineId) {
  const idx = logs.findIndex((l) => l.routineId === routineId && l.date === date);
  if (idx >= 0) {
    logs.splice(idx, 1);
  } else {
    const r = routines.find((x) => x.id === routineId);
    logs.unshift({ id: uid(), routineId, title: r.title, cat: r.cat, date, createdAt: Date.now(), note: '' });
  }
  saveLogs(logs);
  render();
}

function deleteRoutine(routineId) {
  const r = routines.find((x) => x.id === routineId);
  if (!r) return;
  if (!confirm(`"${r.title}" 루틴을 삭제할까요?\n지난 기록은 그대로 남아요.`)) return;
  routines = routines.filter((x) => x.id !== routineId);
  saveRoutines(routines);
  showToast('루틴을 삭제했어요.');
  render();
}

function renameRoutine(routineId) {
  const r = routines.find((x) => x.id === routineId);
  if (!r) return;
  const input = prompt('루틴 이름을 입력하세요', r.title);
  if (input === null) return;
  if (!input.trim()) { showToast('루틴 이름을 입력해주세요.'); return; }
  applyRename(routines, logs, routineId, input);
  showToast('루틴 이름을 바꿨어요.');
  render();
}

function render() {
  document.getElementById('d-label').textContent = date === today ? `오늘 · ${formatKoreanDate(date)}` : formatKoreanDate(date);
  document.getElementById('d-next').disabled = date >= today;
  document.getElementById('d-today').style.display = date === today ? 'none' : '';
  document.getElementById('past-note').hidden = date === today;
  const editBtn = document.getElementById('edit-toggle');
  editBtn.textContent = editMode ? '완료' : '편집';
  editBtn.className = editMode ? 'btn btn-sm' : 'btn btn-ghost btn-sm';

  renderProgress(routines, logs, date);

  const listEl = document.getElementById('routine-list');
  if (routines.length === 0) {
    listEl.innerHTML = `<div class="empty">아직 루틴이 없어요.<br>'루틴' 또는 '추천' 탭에서 나만의 실행리스트를 만들어보세요.</div>`;
    return;
  }

  const grouped = CATS.map((c) => ({ cat: c, items: routines.filter((r) => r.cat === c.id) })).filter((g) => g.items.length);
  listEl.innerHTML = grouped.map((g) => `
    <div class="card" id="cat-${g.cat.id}">
      <div class="section-title"><span class="lv-dot" style="background:${g.cat.color}"></span>${escapeHtml(g.cat.label)}</div>
      ${g.items.map((r) => `
        <div class="routine">
          <button class="check ${isDone(r.id) ? 'done' : ''}" data-toggle="${r.id}" aria-label="${escapeHtml(r.title)} 완료 체크">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="#1B1713" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="routine-body">
            <div class="routine-title ${isDone(r.id) ? 'done' : ''}">${escapeHtml(r.title)}</div>
          </div>
          ${editMode ? `<div class="routine-actions"><button class="routine-del routine-edit" data-edit="${r.id}">수정</button><button class="routine-del" data-del="${r.id}">삭제</button></div>` : ''}
        </div>
      `).join('')}
    </div>
  `).join('');

  listEl.querySelectorAll('[data-toggle]').forEach((el) => { el.onclick = () => toggle(el.dataset.toggle); });
  listEl.querySelectorAll('[data-edit]').forEach((el) => { el.onclick = () => renameRoutine(el.dataset.edit); });
  listEl.querySelectorAll('[data-del]').forEach((el) => { el.onclick = () => deleteRoutine(el.dataset.del); });
}

document.getElementById('d-prev').onclick = () => setDate(shiftDate(date, -1));
document.getElementById('d-next').onclick = () => setDate(shiftDate(date, 1));
document.getElementById('d-today').onclick = () => setDate(today);
document.getElementById('edit-toggle').onclick = () => { editMode = !editMode; render(); };

render();
</script>
</body>
