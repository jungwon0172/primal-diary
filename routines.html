<body>
<div class="tabs">
  <a href="index.html" class="tab">오늘</a>
  <a href="routines.html" class="tab active">루틴</a>
  <a href="history.html" class="tab">기록</a>
  <a href="tools.html" class="tab">도구</a>

<main class="app">
  <div class="hero">
    <div class="hero-eyebrow">ROUTINES</div>
    <h1 class="display">내 루틴</h1>
    <p>나만의 실행리스트를 자유롭게 구성하세요.</p>
  </div>

  <div class="card">
    <div class="section-title">새 루틴 추가</div>
    <div class="row">
      <input type="text" id="new-title" placeholder="예: 냉수 샤워" style="flex:2">
      <select id="new-cat" style="flex:1"></select>
      <button class="btn btn-sm" id="add-btn">추가</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title" id="count-title">내 루틴</div>
    <div id="routine-list"></div>
  </div>
</main>

<footer class="site-footer">
  <a href="about.html">소개</a>
  <a href="guide.html">가이드</a>
  <a href="tools.html">도구</a>
  <a href="contact.html">문의</a>
  <a href="privacy.html">개인정보처리방침</a>
  <a href="terms.html">이용약관</a>
  <span class="footer-copy">© <span id="year"></span> 원시인 다이어리</span>
</footer>

<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

let routines = loadRoutines();

const catSelect = document.getElementById('new-cat');
catSelect.innerHTML = CATS.map((c) => `<option value="${c.id}">${c.label}</option>`).join('');

function render() {
  document.getElementById('count-title').textContent = `내 루틴 (${routines.length})`;
  const listEl = document.getElementById('routine-list');

  if (routines.length === 0) {
    listEl.innerHTML = `<div class="empty">루틴을 추가해보세요.</div>`;
    return;
  }

  listEl.innerHTML = routines.map((r) => {
    const c = catInfo(r.cat);
    return `
      <div class="routine">
        <span class="lv-dot" style="background:${c.color}"></span>
        <div class="routine-body">
          <div class="routine-title">${escapeHtml(r.title)}</div>
          <div class="routine-cat">${c.label}</div>
        </div>
        <button class="routine-del" data-del="${r.id}">삭제</button>
      </div>`;
  }).join('');

  listEl.querySelectorAll('[data-del]').forEach((el) => {
    el.onclick = () => {
      routines = routines.filter((r) => r.id !== el.dataset.del);
      saveRoutines(routines);
      render();
    };
  });
}

document.getElementById('add-btn').onclick = () => {
  const titleInput = document.getElementById('new-title');
  const title = titleInput.value.trim();
  if (!title) return;
  routines.push({ id: uid(), title: title.slice(0, 60), cat: catSelect.value });
  saveRoutines(routines);
  titleInput.value = '';
  showToast('루틴을 추가했어요.');
  render();
};

render();
</script>
</body>
</html>
