<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="나만의 실행리스트를 자유롭게 구성하세요.">
<meta name="google-adsense-account" content="ca-pub-2557338953436433">
<meta name="naver-site-verification" content="43a13ce1e684f0e41eff7b286d124ef4994e0cc3">

<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <nav class="tabs">
      <a href="index.html" class="tab">오늘</a>
      <a href="routines.html" class="tab active">루틴</a>
      <a href="tips.html" class="tab">추천</a>
      <a href="history.html" class="tab">기록</a>
      <a href="tools.html" class="tab">도구</a>
    </nav>
    <nav class="top-links">
      <a href="about.html">소개</a>
      <a href="contact.html">문의</a>
    </nav>
  </div>
</header>

<main class="app">
  <div class="hero">
    <div class="hero-eyebrow">ROUTINES</div>
    <h1 class="display">내 루틴</h1>
    <p>나만의 실행리스트를 추가하고, 이름을 고치거나 필요 없는 루틴은 삭제하세요. 수면 시간은 '도구' 탭에서 정할 수 있어요.</p>
  </div>

  <div class="card">
    <div class="section-title">새 루틴 추가</div>
    <div class="row">
      <input type="text" id="new-title" class="grow" placeholder="예: 냉수 샤워" maxlength="60">
      <select id="new-cat" class="sel"></select>
      <button class="btn btn-sm" id="add-btn">추가</button>
    </div>
  </div>

  <div id="routine-groups"></div>

  <div class="card" id="cat-names-card">
    <div class="section-title">단계 이름 설정</div>
    <p class="section-note">5개 단계의 이름을 원하는 대로 바꿀 수 있어요. 1단계가 가장 기초이고, 오늘 탭의 피라미드 맨 아래에 놓여요.</p>
    <div class="cat-edit-grid" id="cat-edit-grid"></div>
    <div class="row">
      <button class="btn btn-sm" id="cat-save">이름 저장</button>
      <button class="btn btn-ghost btn-sm" id="cat-reset">기본 이름으로</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <a href="about.html">소개</a>
  <a href="guide.html">가이드</a>
  <a href="tips.html">추천</a>
  <a href="tools.html">도구</a>
  <a href="contact.html">문의</a>
  <a href="privacy.html">개인정보처리방침</a>
  <a href="terms.html">이용약관</a>
  <span class="footer-copy">© <span id="year"></span> 투두 브레인</span>
</footer>

<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

let routines = loadRoutines();
let editingId = null;

const catSelect = document.getElementById('new-cat');
function renderCatSelect() {
  const current = catSelect.value;
  catSelect.innerHTML = CATS.map((c) => `<option value="${c.id}">${escapeHtml(c.label)}</option>`).join('');
  if (current) catSelect.value = current;
}
renderCatSelect();

function renderCatEditor() {
  document.getElementById('cat-edit-grid').innerHTML = CATS.map((c, i) => `
    <label><span class="lv"><span class="lv-dot" style="background:${c.color}"></span>${i + 1}단계</span>
      <input type="text" data-cat-input="${c.id}" value="${escapeHtml(c.label)}" maxlength="8" aria-label="${i + 1}단계 이름"></label>
  `).join('');
}
renderCatEditor();

document.getElementById('cat-save').onclick = () => {
  const map = {};
  const seen = new Set();
  for (const input of document.querySelectorAll('[data-cat-input]')) {
    const v = input.value.trim();
    if (!v) { showToast('비어 있는 이름이 있어요.'); return; }
    if (seen.has(v)) { showToast('같은 이름이 있어요. 서로 다르게 정해주세요.'); return; }
    seen.add(v);
    map[input.dataset.catInput] = v;
  }
  saveCatNames(map);
  renderCatSelect();
  render();
  showToast('단계 이름을 저장했어요.');
};

document.getElementById('cat-reset').onclick = () => {
  resetCatNames();
  renderCatSelect();
  renderCatEditor();
  render();
  showToast('기본 이름으로 되돌렸어요.');
};

function saveRename(id, value) {
  const title = value.trim();
  if (!title) { showToast('루틴 이름을 입력해주세요.'); return; }
  const logs = loadLogs();
  if (applyRename(routines, logs, id, title)) {
    editingId = null;
    showToast('루틴 이름을 바꿨어요.');
    render();
  }
}

function render() {
  const root = document.getElementById('routine-groups');
  if (routines.length === 0) {
    root.innerHTML = `<div class="card"><div class="empty">루틴이 없어요. 위에서 추가하거나 '추천' 탭에서 골라보세요.</div></div>`;
    return;
  }

  const grouped = CATS.map((c) => ({ cat: c, items: routines.filter((r) => r.cat === c.id) })).filter((g) => g.items.length);
  root.innerHTML = grouped.map((g) => `
    <div class="card">
      <div class="section-title"><span class="lv-dot" style="background:${g.cat.color}"></span>${escapeHtml(g.cat.label)} <span class="date-count">${g.items.length}개</span></div>
      ${g.items.map((r) => editingId === r.id ? `
        <div class="routine editing">
          <div class="routine-body"><input type="text" class="rename-input" value="${escapeHtml(r.title)}" maxlength="60" aria-label="루틴 이름"></div>
          <div class="routine-actions">
            <button class="btn btn-sm" data-save="${r.id}">저장</button>
            <button class="btn btn-ghost btn-sm" data-cancel="1">취소</button>
          </div>
        </div>` : `
        <div class="routine">
          <div class="routine-body"><div class="routine-title">${escapeHtml(r.title)}</div></div>
          <div class="routine-actions">
            <button class="routine-del routine-edit" data-edit="${r.id}">수정</button>
            <button class="routine-del" data-del="${r.id}">삭제</button>
          </div>
        </div>`).join('')}
    </div>
  `).join('');

  root.querySelectorAll('[data-edit]').forEach((el) => {
    el.onclick = () => { editingId = el.dataset.edit; render(); const i = root.querySelector('.rename-input'); if (i) { i.focus(); i.select(); } };
  });
  root.querySelectorAll('[data-cancel]').forEach((el) => { el.onclick = () => { editingId = null; render(); }; });
  root.querySelectorAll('[data-save]').forEach((el) => {
    el.onclick = () => saveRename(el.dataset.save, root.querySelector('.rename-input').value);
  });
  const input = root.querySelector('.rename-input');
  if (input) {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveRename(editingId, input.value);
      if (e.key === 'Escape') { editingId = null; render(); }
    });
  }

  root.querySelectorAll('[data-del]').forEach((el) => {
    el.onclick = () => {
      const r = routines.find((x) => x.id === el.dataset.del);
      if (!r) return;
      if (!confirm(`"${r.title}" 루틴을 삭제할까요?\n지난 기록은 그대로 남아요.`)) return;
      routines = routines.filter((x) => x.id !== r.id);
      saveRoutines(routines);
      showToast('루틴을 삭제했어요.');
      render();
    };
  });
}

function addRoutine() {
  const input = document.getElementById('new-title');
  const title = input.value.trim();
  if (!title) return;
  routines.push({ id: uid(), title: title.slice(0, 60), cat: catSelect.value });
  saveRoutines(routines);
  input.value = '';
  showToast('루틴을 추가했어요.');
  render();
}

document.getElementById('add-btn').onclick = addRoutine;
document.getElementById('new-title').addEventListener('keydown', (e) => { if (e.key === 'Enter') addRoutine(); });

render();
</script>
</body>
</html>
