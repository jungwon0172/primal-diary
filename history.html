<script src="common.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

let logs = loadLogs();
let view = 'list';
let cursor = (() => { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() }; })();
const noteTimers = {};

function pad(n) { return String(n).padStart(2, '0'); }
function ymd(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function fmtShort(d) { const dt = new Date(d); return `${dt.getMonth() + 1}.${dt.getDate()}`; }

function buildMonthGrid(year, month) {
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  return cells;
}

function renderList() {
  const root = document.getElementById('view-root');
  if (logs.length === 0) {
    root.innerHTML = `<div class="empty">아직 기록이 없어요.<br>'오늘' 탭에서 루틴을 체크해보세요.</div>`;
    return;
  }
  root.innerHTML = `<div class="card">${logs.map((l) => {
    const c = catInfo(l.cat);
    return `
      <div class="log-entry">
        <div class="log-head">
          <div class="log-title"><span class="lv-dot" style="background:${c.color}; margin-right:6px;"></span>${escapeHtml(l.title)}</div>
          <div class="log-date">${fmtShort(l.date)}</div>
        </div>
        <textarea placeholder="오늘 어땠는지 적어보세요 (선택)" data-note="${l.id}">${escapeHtml(l.note || '')}</textarea>
      </div>`;
  }).join('')}</div>`;

  root.querySelectorAll('[data-note]').forEach((el) => {
    el.oninput = () => {
      const id = el.dataset.note;
      clearTimeout(noteTimers[id]);
      noteTimers[id] = setTimeout(() => {
        const entry = logs.find((l) => l.id === id);
        if (entry) { entry.note = el.value; saveLogs(logs); }
      }, 400);
    };
  });
}

function renderCalendar() {
  const root = document.getElementById('view-root');
  const cells = buildMonthGrid(cursor.y, cursor.m);
  const todayS = todayStr();

  const logsByDate = {};
  logs.forEach((l) => {
    if (!logsByDate[l.date]) logsByDate[l.date] = [];
    logsByDate[l.date].push(l);
  });

  const dowRow = ['일', '월', '화', '수', '목', '금', '토'].map((d) => `<div class="cal-dow">${d}</div>`).join('');

  const cellsHtml = cells.map((day) => {
    if (day === null) return `<div class="cal-cell empty"></div>`;
    const dateStr = ymd(cursor.y, cursor.m, day);
    const dayLogs = logsByDate[dateStr] || [];
    const isToday = dateStr === todayS;
    const dots = dayLogs.slice(0, 6).map((l) => `<span class="cal-dot" style="background:${catInfo(l.cat).color}"></span>`).join('');
    return `<div class="cal-cell ${isToday ? 'today' : ''}"><span>${day}</span>${dayLogs.length ? `<div class="cal-dots">${dots}</div>` : ''}</div>`;
  }).join('');

  root.innerHTML = `
    <div class="card">
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev">‹</button>
        <div class="cal-title">${cursor.y}년 ${cursor.m + 1}월</div>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="cal-grid">${dowRow}${cellsHtml}</div>
    </div>
  `;

  document.getElementById('cal-prev').onclick = () => {
    cursor = cursor.m === 0 ? { y: cursor.y - 1, m: 11 } : { y: cursor.y, m: cursor.m - 1 };
    renderCalendar();
  };
  document.getElementById('cal-next').onclick = () => {
    cursor = cursor.m === 11 ? { y: cursor.y + 1, m: 0 } : { y: cursor.y, m: cursor.m + 1 };
    renderCalendar();
  };
}

function setView(v) {
  view = v;
  document.getElementById('btn-list').className = v === 'list' ? 'btn btn-sm' : 'btn btn-ghost btn-sm';
  document.getElementById('btn-calendar').className = v === 'calendar' ? 'btn btn-sm' : 'btn btn-ghost btn-sm';
  if (v === 'list') renderList(); else renderCalendar();
}

document.getElementById('btn-list').onclick = () => setView('list');
document.getElementById('btn-calendar').onclick = () => setView('calendar');

setView('list');
</script>
</body>
</html>
