<script>
document.getElementById('year').textContent = new Date().getFullYear();

let logs = loadLogs();
let routines = loadRoutines();
let view = 'calendar';
const now = new Date();
let cursor = { y: now.getFullYear(), m: now.getMonth() };
const noteTimers = {};
const today = todayStr();

function buildMonthGrid(year, month) {
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  return cells;
}

// ---------- 달력 ----------
function renderCalendar() {
  const root = document.getElementById('view-root');
  const cells = buildMonthGrid(cursor.y, cursor.m);

  // 날짜별로 "어떤 카테고리를 몇 개 했는지" 집계
  const byDate = {};
  logs.forEach((l) => {
    if (!byDate[l.date]) byDate[l.date] = { cats: {}, total: 0 };
    byDate[l.date].cats[l.cat] = (byDate[l.date].cats[l.cat] || 0) + 1;
    byDate[l.date].total++;
  });
  const maxPerDay = Math.max(1, routines.length);

  const dowRow = DOW.map((d) => `<div class="cal-dow">${d}</div>`).join('');

  const cellsHtml = cells.map((day) => {
    if (day === null) return `<div class="cal-cell empty"></div>`;
    const ds = dateToStr(new Date(cursor.y, cursor.m, day));
    const info = byDate[ds];
    const isFuture = ds > today;
    const isToday = ds === today;

    const dots = CATS.map((c) => {
      const on = info && info.cats[c.id];
      return `<span class="cal-dot ${on ? 'on' : ''}" style="${on ? 'background:' + c.color : ''}"></span>`;
    }).join('');

    const alpha = info ? Math.min(0.12 + (info.total / maxPerDay) * 0.4, 0.55) : 0;
    const style = info ? `background: rgba(224,128,60,${alpha.toFixed(2)});` : '';
    const inner = `<span>${day}</span>${isFuture ? '' : `<div class="cal-dots">${dots}</div>`}`;

    if (isFuture) return `<div class="cal-cell future">${inner}</div>`;
    return `<a class="cal-cell ${isToday ? 'today' : ''}" style="${style}" href="index.html?date=${ds}" aria-label="${formatKoreanDate(ds)} 루틴 보기">${inner}</a>`;
  }).join('');

  const canNext = !(cursor.y === now.getFullYear() && cursor.m === now.getMonth());

  root.innerHTML = `
    <div class="card">
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev" aria-label="이전 달">‹</button>
        <div class="cal-title">${cursor.y}년 ${cursor.m + 1}월</div>
        <button class="cal-nav" id="cal-next" aria-label="다음 달" ${canNext ? '' : 'disabled'}>›</button>
      </div>
      <div class="cal-grid">${dowRow}${cellsHtml}</div>
      <div class="legend">${CATS.map((c) => `<span><span class="lv-dot" style="background:${c.color}"></span>${c.label}</span>`).join('')}</div>
      <p class="cal-hint">색이 채워진 점은 그 카테고리에서 1개 이상 체크한 날이에요. 날짜를 누르면 그날의 루틴으로 이동해서 보거나 체크할 수 있어요.</p>
    </div>`;

  document.getElementById('cal-prev').onclick = () => {
    cursor = cursor.m === 0 ? { y: cursor.y - 1, m: 11 } : { y: cursor.y, m: cursor.m - 1 };
    renderCalendar();
  };
  document.getElementById('cal-next').onclick = () => {
    cursor = cursor.m === 11 ? { y: cursor.y + 1, m: 0 } : { y: cursor.y, m: cursor.m + 1 };
    renderCalendar();
  };
}

// ---------- 목록 (날짜별 묶음) ----------
function renderList() {
  const root = document.getElementById('view-root');
  if (logs.length === 0) {
    root.innerHTML = `<div class="empty">아직 기록이 없어요.<br>'오늘' 탭에서 루틴을 체크해보세요.</div>`;
    return;
  }

  const sorted = [...logs].sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  const groups = [];
  sorted.forEach((l) => {
    const last = groups[groups.length - 1];
    if (last && last.date === l.date) last.items.push(l);
    else groups.push({ date: l.date, items: [l] });
  });

  root.innerHTML = groups.map((g) => `
    <div class="card">
      <div class="section-title">
        <a class="date-link" href="index.html?date=${g.date}">${formatKoreanDate(g.date)}</a>
        <span class="date-count">${g.items.length}개 완료</span>
      </div>
      ${g.items.map((l) => {
        const c = catInfo(l.cat);
        return `
        <div class="log-entry">
          <div class="log-head">
            <div class="log-title"><span class="lv-dot" style="background:${c.color}"></span>${escapeHtml(l.title)}</div>
            <button class="routine-del" data-del="${l.id}">삭제</button>
          </div>
          <textarea placeholder="메모 (선택)" data-note="${l.id}">${escapeHtml(l.note || '')}</textarea>
        </div>`;
      }).join('')}
    </div>
  `).join('');

  root.querySelectorAll('[data-note]').forEach((el) => {
    el.oninput = () => {
      const id = el.dataset.note;
      clearTimeout(noteTimers[id]);
      noteTimers[id] = setTimeout(() => {
        const entry = logs.find((l) => l.id === id);
        if (entry) { entry.note = el.value; saveLogs(logs); }
      }, 400);
    };
  });

  root.querySelectorAll('[data-del]').forEach((el) => {
    el.onclick = () => {
      if (!confirm('이 기록을 삭제할까요?')) return;
      logs = logs.filter((l) => l.id !== el.dataset.del);
      saveLogs(logs);
      showToast('기록을 삭제했어요.');
      renderList();
    };
  });
}

function setView(v) {
  view = v;
  document.getElementById('btn-calendar').className = v === 'calendar' ? 'btn btn-sm' : 'btn btn-ghost btn-sm';
  document.getElementById('btn-list').className = v === 'list' ? 'btn btn-sm' : 'btn btn-ghost btn-sm';
  if (v === 'calendar') renderCalendar(); else renderList();
}

document.getElementById('btn-calendar').onclick = () => setView('calendar');
document.getElementById('btn-list').onclick = () => setView('list');

setView('calendar');
</script>
