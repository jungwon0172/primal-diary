let current = 'diet';

function addRoutine(tip) {
  const routines = loadRoutines();
  if (routines.some((r) => r.title === tip.routine.title)) {
    showToast('이미 내 루틴에 있어요.');
    return;
  }
  routines.push({ id: uid(), title: tip.routine.title, cat: tip.routine.cat });
  saveRoutines(routines);
  showToast('내 루틴에 추가했어요.');
  render();
}

function render() {
  const section = SECTIONS[current];
  document.getElementById('section-note').textContent = section.note;

  document.querySelectorAll('[data-tab]').forEach((el) => {
    el.className = el.dataset.tab === current ? 'btn btn-sm' : 'btn btn-ghost btn-sm';
  });

  const routines = loadRoutines();
  const has = (t) => routines.some((r) => r.title === t);

  const listEl = document.getElementById('tip-list');
  listEl.innerHTML = section.tips.map((tip, i) => {
    const added = tip.routine && has(tip.routine.title);
    const cat = tip.routine ? catInfo(tip.routine.cat) : null;
    return `
      <div class="tip">
        <div class="tip-head">
          <div>
            <p class="tip-title">${escapeHtml(tip.title)}</p>
            <p class="tip-desc">${escapeHtml(tip.desc)}</p>
            ${cat ? `<div class="tip-meta"><span class="lv-dot" style="background:${cat.color}"></span>${cat.label} · "${escapeHtml(tip.routine.title)}"</div>` : ''}
          </div>
          ${tip.routine ? `<button class="btn ${added ? 'btn-ghost' : ''} btn-sm" data-add="${i}" ${added ? 'disabled' : ''}>${added ? '추가됨' : '+ 루틴'}</button>` : ''}
        </div>
      </div>`;
  }).join('');

  listEl.querySelectorAll('[data-add]').forEach((el) => {
    el.onclick = () => addRoutine(section.tips[Number(el.dataset.add)]);
  });
}

document.querySelectorAll('[data-tab]').forEach((el) => {
  el.onclick = () => { current = el.dataset.tab; render(); };
});

render();
</script>
